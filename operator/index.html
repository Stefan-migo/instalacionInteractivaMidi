<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIDI · Operador</title>
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="/operator/operator.css">
  <script src="/shared/theme.js"></script>
  <script src="/operator/operator.js" defer></script>
</head>
<body>
  <header><h1>MIDI <span>· Operador</span></h1><button id="theme-toggle" type="button" aria-pressed="false">Tema claro</button><p id="connection">Esperando collage…</p></header>
  <main>
    <section><h2>Tema</h2><p>La preferencia se sincroniza entre las ventanas de este navegador.</p></section>
    <section><h2>01 · Distribución</h2><div id="presets" class="presets"></div></section>
    <section><h2>02 · Escala de dispersión</h2><label for="scatter">Escala</label><output id="scatter-value"></output><input id="scatter" type="range" min="0.4" max="1.6" step="0.05"></section>
    <section><h2>03 · Intensidad de ruido</h2><label for="noise">Intensidad</label><output id="noise-value"></output><input id="noise" type="range" min="0" max="100" step="5"></section>
    <section><h2>04 · Catálogo</h2><div id="catalog" role="listbox" aria-label="Catálogo de celdas"></div></section>
    <section id="editor"><h2>05 · Editor de celda <span id="selected-label">—</span></h2>
      <button id="visibility-toggle" type="button" aria-pressed="false" disabled>Celda oculta</button>
      <div class="row"><label for="filter">Filtro</label><select id="filter"></select></div>
      <div class="row"><label for="border">Borde</label><select id="border"></select></div>
      <div class="range"><label for="rotation">Rotación</label><output id="rotation-value"></output><input id="rotation" type="range" min="-180" max="180" step="1"></div>
      <div class="range"><label for="scale">Escala</label><output id="scale-value"></output><input id="scale" type="range" min="0.4" max="1.8" step="0.05"></div>
      <div class="range"><label for="opacity">Opacidad</label><output id="opacity-value"></output><input id="opacity" type="range" min="0" max="1" step="0.05"></div>
    </section>
    <section><h2>06 · Acciones</h2><button id="scatter-all">Esparcir todo</button><div class="actions"><button data-action="left">Girar −15°</button><button data-action="right">Girar +15°</button><button data-action="front">Traer al frente</button><button data-action="hide">Ocultar</button></div></section>
  </main>
</body>
</html>
