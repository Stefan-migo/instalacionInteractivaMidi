<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIDI · Proyector</title>
  <link rel="icon" href="/phone-client/icons/favicon.ico" sizes="any">
  <link rel="icon" href="/phone-client/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/phone-client/icons/apple-touch-icon.png">
  <link rel="manifest" href="/phone-client/icons/site.webmanifest">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <link rel="stylesheet" href="/shared/theme.css">
  <script src="/shared/theme.js"></script>
  <script>MidiTheme.getTheme();</script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, sans-serif;
    }

    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--paper); color: var(--ink); font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Courier New', monospace; z-index: 999;
      text-transform: uppercase; letter-spacing: 0.14em;
    }
    #loading .spinner { width: 48px; height: 48px; border: 2px solid var(--rule-color); border-top-color: var(--paper); animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 1rem; color: var(--ink); }
    #loading .count { font-size: 0.875rem; color: var(--quiet); margin-top: 0.5rem; }

    #qr-wrapper {
      position: fixed; bottom: 1rem; right: 1rem; z-index: 100;
      background: var(--paper);
      padding: 6px; border: 2px solid var(--rule-color);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    #qr-wrapper img { display: block; width: 80px; height: 80px; }
    #qr-wrapper .qr-label { color: var(--ink); font-size: 0.6rem; font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Courier New', monospace; text-transform: uppercase; letter-spacing: 0.14em; }
    
    #brand-mark {
      position: fixed; inset: 0; display: grid; place-items: center;
      opacity: .6; pointer-events: none; z-index: 10;
      color: var(--mark-on-canvas);
    }
    #brand-mark svg { width: min(40vw, 780px); height: auto; fill: currentColor; }

    /* Paint layer overlay: film grain */
    #p5_loading { display: none; }
    canvas { display: block; margin: 0 auto; position: relative; z-index: 2; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Cargando collage...</p>
    <div class="count" id="load-count">0 / 0</div>
  </div>

  <div id="qr-wrapper" style="display:none">
    <img id="qr-img" alt="QR para conectar teléfono" />
    <span class="qr-label">Escaneá para conectar</span>
  </div>
  <script>
    // Set QR code pointing to the phone-client URL
    (function() {
      var qr = document.getElementById('qr-wrapper');
      var img = document.getElementById('qr-img');
      var url = encodeURIComponent(window.location.origin + '/phone-client');
      img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=' + url;
      img.onload = function() { qr.style.display = 'flex'; };
      img.onerror = function() { qr.style.display = 'none'; };
    })();
  </script>
  <script src="/p5-collage/config.js"></script>
  <script src="/p5-collage/collage-layout.js"></script>
  <script src="/p5-collage/sensor-mapper.js"></script>
  <script src="/p5-collage/cell-renderer.js"></script>
  <script src="/p5-collage/cell-image.js"></script>
  <script src="/p5-collage/image-loader.js"></script>
  <script src="/p5-collage/device-manager.js"></script>
  <script src="/p5-collage/image-deck.js"></script>
  <script src="/p5-collage/transition-renderer.js"></script>
  <script src="/p5-collage/layout-preset-engine.js"></script>
  <script src="/p5-collage/background-texture.js"></script>
  <script src="/p5-collage/drag-manager.js"></script>
  <script src="/p5-collage/cell-actions.js"></script>
  <script src="/p5-collage/sketch.js"></script>
  <script src="/p5-collage/operator-link.js"></script>
</body>
</html>
